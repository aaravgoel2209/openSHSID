{% extends 'qa/base.html' %}
{% block title %}分享经验 - 经验知识库{% endblock %}
{% block content %}
    <h2 class="mb-4">分享经验</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">标题</label>
            <input type="text" name="title" id="title" class="form-control" required maxlength="200">
        </div>
        <div class="row mb-3">
            <div class="col">
                <label for="grade" class="form-label">年级</label>
                <select name="grade" id="grade" class="form-select" required>
                    <option value="">选择年级</option>
                    {% for g in grades %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col">
                <label for="subject" class="form-label">学科</label>
                <select name="subject" id="subject" class="form-select" required>
                    <option value="">选择学科</option>
                    {% for s in subjects %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label for="author_name" class="form-label">作者（选填）</label>
            <input type="text" name="author_name" id="author_name" class="form-control" placeholder="你的名字或昵称" maxlength="100">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">内容</label>
            <textarea name="content" id="content" class="form-control" rows="10" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">发布</button>
        <a href="{% url 'article_list' %}" class="btn btn-outline-secondary">取消</a>
    </form>
{% endblock %}
