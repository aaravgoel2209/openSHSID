services:
  backend:
    build: .
    container_name: ghcr.io/aaravgoel2209/shsid-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=OpenSHSID_backend.settings
    restart: unless-stopped

  model:
    build:
      context: .
      dockerfile: model/Dockerfile
    container_name: ghcr.io/aaravgoel2209/shsid-model:latest
    ports:
      - "5000:5000"
    volumes:
      - ./model/data:/app/model/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "80:5173"
    depends_on:
      - backend
    restart: unless-stopped
