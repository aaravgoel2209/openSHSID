name: Docker Image CI

on:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

# 重要：授予对 packages 的写入权限
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: |
        # 生成时间戳标签
        TIMESTAMP=$(date +%s)
        # 本地构建时的镜像名（可选）
        docker build . --file Dockerfile --tag shsid-backend:$TIMESTAMP
        # 为 GHCR 打标签，使用小写仓库名（GitHub 要求全小写）
        IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/shsid-backend:$TIMESTAMP
        docker tag shsid-backend:$TIMESTAMP $IMAGE_NAME
        # 同时打一个 latest 标签（可选，便于拉取最新）
        docker tag shsid-backend:$TIMESTAMP ghcr.io/${{ github.repository_owner }}/shsid-backend:latest

    - name: Push Docker image to GitHub Packages
      run: |
        TIMESTAMP=$(date +%s)
        docker push ghcr.io/${{ github.repository_owner }}/shsid-backend:$TIMESTAMP
        docker push ghcr.io/${{ github.repository_owner }}/shsid-backend:latest