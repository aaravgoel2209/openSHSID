name: Docker Image CI

on:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate timestamp
      run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and tag Docker image
      run: |
        docker build . --file Dockerfile --tag shsid-backend:${{ env.TIMESTAMP }}
        docker tag shsid-backend:${{ env.TIMESTAMP }} ghcr.io/${{ github.repository_owner }}/shsid-backend:${{ env.TIMESTAMP }}
        docker tag shsid-backend:${{ env.TIMESTAMP }} ghcr.io/${{ github.repository_owner }}/shsid-backend:latest

    - name: Push Docker image to GitHub Packages
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/shsid-backend:${{ env.TIMESTAMP }}
        docker push ghcr.io/${{ github.repository_owner }}/shsid-backend:latest