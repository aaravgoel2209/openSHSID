name: Docker Image CI

on:
  push:
    branches: ["alpha"]
  pull_request:
    branches: ["alpha"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Generate timestamp
        run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-backend:${{ env.TIMESTAMP }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-frontend:${{ env.TIMESTAMP }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-frontend:latest

      - name: Build and push model
        uses: docker/build-push-action@v6
        with:
          context: .
          file: model/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-model:${{ env.TIMESTAMP }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shsid-model:latest
