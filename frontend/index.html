<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让 WebView 内容延伸到刘海/圆角区域，
         由 CSS env(safe-area-inset-*) 负责避让（Cordova 原生壳全屏时必需） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="openSHSID —— 问答 / 知识库 / LinkedClassroom" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS「添加到主屏幕」：manifest 本身在 iOS 上支持有限，这几个标签才是实际生效的 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="openSHSID" />
    <title>openSHSID</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
