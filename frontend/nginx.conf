server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver — allows runtime resolution of upstream hostnames
    resolver 127.0.0.11 valid=10s;

    # Proxy API requests to Django backend
    location /api/ {
        set $upstream_backend http://backend:19424;
        # 注意：proxy_pass 用了变量时，nginx 会把后面的 URI 原样替换掉整个请求路径，
        # 所以必须用 $request_uri 透传完整路径（如 /api/knowledge/articles/），
        # 否则 Django 只会收到 /api/ 而 404。
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy admin requests to Django backend
    location /admin/ {
        set $upstream_backend http://backend:19424;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy user-uploaded media (avatars, etc.) to Django. Serializers return
    # root-relative /media/... URLs, so avatars resolve against this origin
    # instead of the backend's internal host.
    location /media/ {
        set $upstream_backend http://backend:19424;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
